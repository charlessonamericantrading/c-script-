[package]
name = "linkc"
version = "1.139.0"
edition = "2021"
default-run = "linkc"

[lib]
name = "linkc"
path = "src/lib.rs"

[[bin]]
name = "linkc"
path = "src/main.rs"

[[bin]]
name = "wasm_demo"
path = "src/bin/wasm_demo.rs"

[features]
default = ["runtime"]
# Todas las dependencias nativas del intérprete/servidor (sockets, SQLite en C,
# TLS, RNG del sistema) viven detrás de este feature. Apagarlo (--no-default-features)
# deja compilar lexer/parser/checker/codegen a wasm32-unknown-unknown.
runtime = [
    "dep:tiny_http",
    "dep:rusqlite",
    "dep:ureq",
    "dep:base64",
    "dep:argon2",
    "dep:getrandom",
    "dep:subtle",
    "dep:postgres",
    "dep:hmac",
    "dep:rustls",
    "dep:tokio-postgres-rustls",
    "dep:lettre",
    "dep:parking_lot",
    "dep:flate2",
]

[dependencies]
tiny_http = { version = "0.12", optional = true }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
wasm-encoder = "0.200"
# Primera excepción real a "cero dependencias nuevas" del proyecto (ver
# GRAMMAR.md §3.73 -- la segunda es `flate2`, más abajo): a diferencia de
# UUID/SHA-256/ISO-8601 (formas FIJAS y acotadas, triviales de escanear a
# mano -- ver `is_canonical_uuid` en runtime/mod.rs), un patrón de
# `@validate(regex, "...")` es TEXTO ARBITRARIO DEL USUARIO -- soportar
# solo un subconjunto de regex a mano sería un espejismo de corrección, no
# una alternativa razonable. Pura Rust (sin dependencias C), compila
# también a wasm32-unknown-unknown -- por eso NO está detrás del feature
# `runtime` como rusqlite/postgres/etc.
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
sha2 = "0.10"
ureq = { version = "2.9", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = { version = "0.2", optional = true }
subtle = { version = "2", optional = true }
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
# Pilar 1 del roadmap de concurrencia (propuesto a partir del pedido de
# skynet-d3, 26/08/2026): `linkc serve` pasa de un hilo/una request a la vez
# a un hilo por request, con la conexión real (SQLite o Postgres) detrás de
# UN candado reentrante -- reentrante porque `transaction { }` necesita
# sostenerlo por TODA su duración (BEGIN + cuerpo + COMMIT/ROLLBACK), y el
# cuerpo llama de vuelta a operaciones (`insert`/`applyPatch`/etc.) que
# también lo piden; un `std::sync::Mutex` común haría deadlock del hilo
# consigo mismo en ese caso. Ya era dependencia transitiva (via otras
# crates) -- agregarla como directa no suma peso real al binario. Sin
# alternativa razonable en std: `std::sync::Mutex` no es reentrante.
parking_lot = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"], optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls-tls"], optional = true }
# Segunda excepción real a "cero dependencias nuevas" (ver `regex` arriba
# para la primera, GRAMMAR.md §3.180): GZIP/DEFLATE no es un formato
# binario chico y fijo como los que este proyecto sí hand-rollea (UUID,
# HMAC-SHA256, el wire de `inet`/`timestamp`/`numeric` de Postgres) -- es
# un algoritmo de compresión real (LZ77 + Huffman), y un encoder DEFLATE
# a mano, aunque técnicamente posible, es una superficie de bugs real (un
# stream corrupto silencioso es mucho peor que un 500 limpio) sin ningún
# beneficio sobre una implementación ya madura y ampliamente usada.
# `flate2` con su backend por default (`miniz_oxide`, Rust puro) -- sin
# `zlib-ng`/`cloudflare_zlib` ni ninguna dependencia C, mismo criterio de
# "sin tooling nuevo que instalar" que el resto del proyecto.
flate2 = { version = "1", optional = true }
