[package]
name = "linkc"
version = "1.0.0"
edition = "2021"
default-run = "linkc"

[lib]
name = "linkc"
path = "src/lib.rs"

[[bin]]
name = "linkc"
path = "src/main.rs"

[[bin]]
name = "wasm_demo"
path = "src/bin/wasm_demo.rs"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
wasm-encoder = "0.200"
rusqlite = { version = "0.40", features = ["bundled"] }
