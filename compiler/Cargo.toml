[package]
name = "linkc"
version = "1.207.0"
edition = "2021"
default-run = "linkc"

[lib]
name = "linkc"
path = "src/lib.rs"

[[bin]]
name = "linkc"
path = "src/main.rs"

[[bin]]
name = "wasm_demo"
path = "src/bin/wasm_demo.rs"

[features]
default = ["runtime", "inference"]
# Todas las dependencias nativas del intérprete/servidor (sockets, SQLite en C,
# TLS, RNG del sistema) viven detrás de este feature. Apagarlo (--no-default-features)
# deja compilar lexer/parser/checker/codegen a wasm32-unknown-unknown.
runtime = [
    "dep:tiny_http",
    "dep:rusqlite",
    "dep:ureq",
    "dep:base64",
    "dep:argon2",
    "dep:bcrypt",
    "dep:getrandom",
    "dep:subtle",
    "dep:postgres",
    "dep:hmac",
    "dep:rustls",
    "dep:tokio-postgres-rustls",
    "dep:lettre",
    "dep:parking_lot",
    "dep:flate2",
    "dep:aes-gcm",
    "dep:pdf-writer",
    "dep:rust_xlsxwriter",
    "dep:calamine",
    "dep:image",
]
# GRAMMAR.md §3.233 / PLAN.md §9.20 Eje G: el motor de inferencia de Skynet
# (Rust puro, cero dependencias externas, vendorizado en `inference/crates/`,
# ver `inference/VENDORED.md`) embebido en el binario. Implica `runtime`
# porque los builtins `ai.*` viven en el intérprete. Apagable con
# `--no-default-features --features runtime` para un binario sin motor.
inference = ["runtime", "dep:inference-server", "dep:model-core"]

[dependencies]
tiny_http = { version = "0.12", optional = true }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
wasm-encoder = "0.200"
# Primera excepción real a "cero dependencias nuevas" del proyecto (ver
# GRAMMAR.md §3.73 -- la segunda es `flate2`, más abajo): a diferencia de
# UUID/SHA-256/ISO-8601 (formas FIJAS y acotadas, triviales de escanear a
# mano -- ver `is_canonical_uuid` en runtime/mod.rs), un patrón de
# `@validate(regex, "...")` es TEXTO ARBITRARIO DEL USUARIO -- soportar
# solo un subconjunto de regex a mano sería un espejismo de corrección, no
# una alternativa razonable. Pura Rust (sin dependencias C), compila
# también a wasm32-unknown-unknown -- por eso NO está detrás del feature
# `runtime` como rusqlite/postgres/etc.
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
sha2 = "0.10"
ureq = { version = "2.9", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
argon2 = { version = "0.5", optional = true }
# GRAMMAR.md §3.226: bcrypt SOLO para VERIFICAR (migrar) hashes que otra app
# ya emitió (`$2a$`/`$2b$`/`$2y$` -- bcryptjs, PHP password_hash, Spring
# Security, Devise). `hashPassword` sigue emitiendo únicamente Argon2id.
# Misma justificación que `argon2`/`aes-gcm`: un hash de contraseñas nunca
# se hand-rollea. RustCrypto-adyacente, Rust puro (blowfish + base64 propio),
# sin dependencias C.
bcrypt = { version = "0.19", optional = true }
getrandom = { version = "0.2", optional = true }
subtle = { version = "2", optional = true }
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
# Pilar 1 del roadmap de concurrencia (propuesto a partir del pedido de
# skynet-d3, 26/08/2026): `linkc serve` pasa de un hilo/una request a la vez
# a un hilo por request, con la conexión real (SQLite o Postgres) detrás de
# UN candado reentrante -- reentrante porque `transaction { }` necesita
# sostenerlo por TODA su duración (BEGIN + cuerpo + COMMIT/ROLLBACK), y el
# cuerpo llama de vuelta a operaciones (`insert`/`applyPatch`/etc.) que
# también lo piden; un `std::sync::Mutex` común haría deadlock del hilo
# consigo mismo en ese caso. Ya era dependencia transitiva (via otras
# crates) -- agregarla como directa no suma peso real al binario. Sin
# alternativa razonable en std: `std::sync::Mutex` no es reentrante.
parking_lot = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"], optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls-tls"], optional = true }
# Segunda excepción real a "cero dependencias nuevas" (ver `regex` arriba
# para la primera, GRAMMAR.md §3.180): GZIP/DEFLATE no es un formato
# binario chico y fijo como los que este proyecto sí hand-rollea (UUID,
# HMAC-SHA256, el wire de `inet`/`timestamp`/`numeric` de Postgres) -- es
# un algoritmo de compresión real (LZ77 + Huffman), y un encoder DEFLATE
# a mano, aunque técnicamente posible, es una superficie de bugs real (un
# stream corrupto silencioso es mucho peor que un 500 limpio) sin ningún
# beneficio sobre una implementación ya madura y ampliamente usada.
# `flate2` con su backend por default (`miniz_oxide`, Rust puro) -- sin
# `zlib-ng`/`cloudflare_zlib` ni ninguna dependencia C, mismo criterio de
# "sin tooling nuevo que instalar" que el resto del proyecto.
flate2 = { version = "1", optional = true }
# Tercera excepción real a "cero dependencias nuevas" (ver `regex`/`flate2`
# arriba): a diferencia de los formatos binarios de layout FIJO que este
# proyecto sí hand-rollea (UUID, HMAC-SHA256, el wire de `inet`/`timestamp`/
# `numeric` de Postgres -- todos parseo/serialización de una forma
# documentada, sin decisión criptográfica de por medio), un CIFRADOR
# simétrico NUNCA debería hand-rollearse -- es exactamente el tipo de caso
# donde "sin dependencia nueva salvo que no haya alternativa razonable"
# aplica con más fuerza, no menos. `aes-gcm` (RustCrypto, implementación de
# referencia del ecosistema) -- AEAD: cifra Y autentica en una sola
# operación, evita el error clásico de cifrar sin autenticar.
aes-gcm = { version = "0.10", optional = true }
# Cuarta excepción real a "cero dependencias nuevas" (ver `regex`/`flate2`/
# `aes-gcm` arriba, GRAMMAR.md §3.201): PDF (objetos indirectos, tabla xref,
# streams, diccionarios de fuente) es un FORMATO real y complejo, no un
# layout binario chico y fijo como los que este proyecto sí hand-rollea --
# escribir el xref/trailer a mano es la misma clase de superficie de bugs
# silenciosos que ya justificó `flate2` (un PDF corrupto que algunos
# lectores toleran y otros no es peor que un error de build limpio).
# `pdf-writer` (RustCrypto/Typst) es deliberadamente BAJO NIVEL -- da la
# sintaxis binaria del PDF (objetos, streams, xref), no layout de texto ni
# fuentes embebidas -- coincide con el mismo criterio de "una crate mínima
# para el formato de fondo, el resto se hand-rollea arriba" que ya rige el
# resto del proyecto (mismo mantenedor que `regex`/`flate2` en la práctica:
# ecosistema Typst/RustCrypto, activamente mantenida, solo 4 dependencias
# directas triviales -- se descartaron `printpdf` por arrastrar el
# framework GUI Azul completo, ~717K SLoC de árbol transitivo, y `genpdf`
# por estar abandonada desde 2021).
pdf-writer = { version = "0.15", optional = true }
# Quinta Y sexta excepción real a "cero dependencias nuevas" (ver `pdf-writer`
# arriba, GRAMMAR.md §3.202) -- una excepción conjunta, no dos separadas:
# `.xlsx` (OOXML) es un contenedor ZIP con XML adentro, la misma clase de
# formato real y complejo que ya justificó `pdf-writer` -- ninguna crate
# madura del ecosistema escribe Y lee `.xlsx` bien a la vez, así que hacen
# falta dos. Las dos comparten `zip` como dependencia transitiva, así que
# sumar las dos no duplica la superficie de "implementación de ZIP", solo
# el mapeo OOXML<->celdas de cada una. `rust_xlsxwriter` (escritura) y
# `calamine` (lectura) -- ambas MIT, activamente mantenidas, evaluadas
# contra el mismo criterio de licencia/mantenimiento/tamaño de árbol que
# las excepciones anteriores.
rust_xlsxwriter = { version = "0.99", optional = true }
# Séptima excepción real a "cero dependencias nuevas" (ver `regex`/`flate2`/
# `aes-gcm`/`pdf-writer`/`rust_xlsxwriter`+`calamine` arriba, GRAMMAR.md
# §3.258): decodificar/redimensionar/codificar JPEG/PNG/GIF/BMP/WebP es el
# mismo tipo de formato real y complejo (cuantización DCT, filtros de
# predicción, LZW/deflate) que ya justificó las excepciones anteriores --
# ningún subconjunto hand-rolleado de "solo lo que un thumbnail necesita"
# sería honesto. `image` (image-rs, el decodificador de facto del
# ecosistema Rust: usado por `resvg`/`usvg` de Typst, `photon`, etc.) --
# MIT/Apache-2.0, activamente mantenida. `default-features = false` +
# solo los 5 códecs que un backend real recibe de un cliente/navegador
# (`jpeg`/`png`/`gif`/`bmp`/`webp`) -- todos decodificadores PURO RUST bajo
# esas features (ninguno linkea contra libjpeg/libpng/libwebp en C), así
# que esto no reintroduce la clase de dependencia C que `rusqlite`
# (`bundled`) ya es la única excepción conocida a "sin tooling nuevo que
# instalar". Formatos pesados/nicho (avif -- necesita un decodificador AV1
# entero, tiff, dds, hdr, openexr, qoi) deliberadamente AFUERA -- ninguno
# de los tres proyectos reales de este ecosistema (MyFinance/Ignis
# Love/CRM) citó necesitarlos, mismo criterio que descartó MySQL en
# §9.12 ítem 8.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"], optional = true }
# GRAMMAR.md §3.233: el motor de inferencia vendorizado (feature `inference`).
# `server` es el crate que junta cargador GGUF, cache de modelos residentes y
# resolución de alias de Ollama; `model-core` trae los traits
# `LanguageModel`/`ModelTokenizer` que el runtime necesita nombrar.
inference-server = { package = "server", path = "inference/crates/server", version = "0.1.0", optional = true }
model-core = { path = "inference/crates/model-core", version = "0.1.0", optional = true }
calamine = { version = "0.36", optional = true }

# Benchmarks de humo (PLAN.md §9.18 Eje B ítem 1, GRAMMAR.md §3.217).
# `criterion` es dependencia SOLO de desarrollo -- no entra al binario
# `linkc`, así que no es una excepción a "cero dependencias nuevas" (esa
# regla protege lo que se DISTRIBUYE). Sin `default-features` para no
# arrastrar `rayon`/plots HTML que ningún benchmark de acá usa; el reporte
# de texto con cambio relativo contra la corrida anterior es lo que importa.
[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "smoke"
harness = false
