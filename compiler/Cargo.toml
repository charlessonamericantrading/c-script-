[package]
name = "linkc"
version = "1.3.0"
edition = "2021"
default-run = "linkc"

[lib]
name = "linkc"
path = "src/lib.rs"

[[bin]]
name = "linkc"
path = "src/main.rs"

[[bin]]
name = "wasm_demo"
path = "src/bin/wasm_demo.rs"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
wasm-encoder = "0.200"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
ureq = { version = "2.9", default-features = false }
base64 = "0.22"
argon2 = "0.5"
getrandom = "0.2"
subtle = "2"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
hmac = "0.12"
