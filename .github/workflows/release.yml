name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linkc
            asset_name: linkc-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false

          # GitHub retiró la imagen macos-13 de sus runners hosteados (el job
          # se quedaba en cola indefinidamente, runner_id: 0, mientras el de
          # abajo -- misma familia de runner -- arrancaba al instante).
          # macos-14 es Apple Silicon nativo, pero cross-compila x86_64 sin
          # problema: el toolchain de Xcode en Apple Silicon soporta ambas
          # arquitecturas (`clang -arch x86_64`) desde siempre.
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: linkc
            asset_name: linkc-x86_64-apple-darwin.tar.gz
            use_cross: false

          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: linkc
            asset_name: linkc-aarch64-apple-darwin.tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: linkc.exe
            asset_name: linkc-x86_64-pc-windows-msvc.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        working-directory: compiler
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd compiler/target/${{ matrix.target }}/release
          tar -czvf ../../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path compiler\target\${{ matrix.target }}\release\${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec mv {} release-assets/ \;
          if [ -f editors/vscode/c-script-vscode-1.0.0.vsix ]; then
            cp editors/vscode/c-script-vscode-1.0.0.vsix release-assets/
          fi

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
