name: CI

# Auditoría post-push (integridad 2/2, ver README.md "Status"): la ronda
# anterior encontró el demo insignia roto (frontend/src/main.ts llamaba a
# rpc protegidos sin loguearse) sin que ningún test lo detectara, porque
# nada corría el camino completo -- compilar, tipar el frontend contra el
# contrato generado, Y correr el demo real contra un servidor real. Este
# workflow es exactamente esos 3 pasos (los mismos que documenta el
# README bajo "Try the killer feature yourself"), automatizados, para que
# ese tipo de deriva falle en CI en vez de esperar a la próxima auditoría
# manual.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu para velocidad/costo; windows porque el propio proyecto
        # documenta bugs reales encontrados solo ahí (framing del LSP
        # sobre pipes de Windows, GRAMMAR.md §3.19) -- no es precaución
        # genérica, es un historial real de este código.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: cargo test (unitarios + subprocesos reales de LSP y servidor HTTP)
        working-directory: compiler
        # cargo test también compila target/debug/linkc como efecto
        # colateral (los tests de integración lo referencian vía
        # env!("CARGO_BIN_EXE_linkc")) -- no hace falta un `cargo build`
        # aparte antes del demo E2E de más abajo.
        run: cargo test --locked

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # native TS type-stripping sin flags (verificado localmente en 24.14.0); ver frontend/src/main.ts
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Regenerar el contrato desde el backend (linkc build)
        run: |
          BIN=compiler/target/debug/linkc
          [ "$RUNNER_OS" = "Windows" ] && BIN="${BIN}.exe"
          "$BIN" build examples/users.link gen

      - name: Contrato del demo insignia sin deriva sin querer (linkc test, GRAMMAR.md §3.29)
        # Sin --update: si el contrato cambió de forma real, este paso
        # falla a propósito -- la corrección es commitear el nuevo
        # examples/users.link.snap en el mismo PR (`linkc test ... --update`),
        # no que CI lo acepte solo.
        run: |
          BIN=compiler/target/debug/linkc
          [ "$RUNNER_OS" = "Windows" ] && BIN="${BIN}.exe"
          "$BIN" test examples/users.link examples/users.link.snap

      - name: Confirmar que el frontend tipa limpio contra el contrato generado
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Demo E2E real (servidor real + cliente generado real)
        run: |
          set -e
          BIN=compiler/target/debug/linkc
          [ "$RUNNER_OS" = "Windows" ] && BIN="${BIN}.exe"

          "$BIN" serve examples/users.link 8787 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            curl -s -o /dev/null http://127.0.0.1:8787/Users/list && break
            sleep 0.1
          done

          cd frontend
          node src/main.ts

  # El backend PostgreSQL solo se puede probar contra un PostgreSQL. Sin este
  # job, `runtime/store.rs` y `Db::connect_postgres` compilarian y nadie los
  # correria nunca -- que es exactamente como el repo llego a tener un
  # "adaptador PostgreSQL enterprise" que en realidad solo generaba texto SQL.
  postgres:
    name: Integración contra PostgreSQL real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: link
          POSTGRES_DB: linkc_test
        ports:
          - 5432:5432
        # Sin el health-check, los tests arrancan antes de que la base acepte
        # conexiones y fallan de forma intermitente por una razón que no tiene
        # nada que ver con el código.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Tests de integración contra PostgreSQL
        working-directory: compiler
        env:
          LINK_TEST_PG_URL: postgres://postgres:link@localhost:5432/linkc_test
          # Convierte "no hay base, me salteo" en una falla: sin esto el job
          # pasaría en verde sin haberse conectado a nada.
          LINK_TEST_PG_REQUIRED: "1"
        run: cargo test --locked --test pg_integration

      - name: El servidor sirve de verdad desde PostgreSQL (demo E2E)
        working-directory: compiler
        env:
          LINK_DATABASE_URL: postgres://postgres:link@localhost:5432/linkc_test
        run: |
          set -e
          cargo build --locked
          ./target/debug/linkc serve ../examples/users.link 8788 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            curl -s -o /dev/null http://127.0.0.1:8788/health && break
            sleep 0.1
          done
          # El mismo demo insignia que el job de arriba corre sobre SQLite,
          # ahora contra PostgreSQL: si el backend nuevo rompiera el programa
          # de referencia, se ve acá.
          curl -sf -X POST http://127.0.0.1:8788/Users/create \
            -H 'Content-Type: application/json' \
            -d '{"input":{"name":"Ada","email":"ada@example.com","createdAt":"2026-08-20T10:00:00.000Z"}}' \
            | tee /dev/stderr | grep -q '"type":"Ok"'
          curl -sf http://127.0.0.1:8788/Users/list | tee /dev/stderr | grep -q 'ada@example.com'
