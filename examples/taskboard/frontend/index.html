<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Kanban Taskboard (Real-Time SSE)</title>
    <style>
      :root {
        --bg-main: #0f172a;
        --bg-card: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #38bdf8;
        --todo: #64748b;
        --inprogress: #f59e0b;
        --done: #10b981;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { background-color: var(--bg-main); color: var(--text); padding: 24px; }
      .container { max-width: 1200px; margin: 0 auto; }
      header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
      h1 { font-size: 1.75rem; font-weight: 700; color: #fff; }
      .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 9999px; text-transform: uppercase; font-weight: 600; }
      .badge-todo { background: #334155; color: #cbd5e1; }
      .badge-inprogress { background: #78350f; color: #fde68a; }
      .badge-done { background: #064e3b; color: #a7f3d0; }
      .badge-high { background: #7f1d1d; color: #fecaca; }
      .badge-med { background: #713f12; color: #fef08a; }
      .badge-low { background: #14532d; color: #bbf7d0; }
      .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
      .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
      .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
      .stat-lbl { font-size: 0.875rem; color: var(--text-muted); }
      .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
      .column { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-height: 500px; display: flex; flex-direction: column; }
      .col-header { font-weight: 600; font-size: 1rem; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
      .task-card { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 12px; transition: transform 0.1s; }
      .task-card:hover { border-color: var(--primary); }
      .task-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
      .task-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
      .task-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }
      .actions { display: flex; gap: 6px; margin-top: 8px; }
      button { background: #334155; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.75rem; cursor: pointer; }
      button:hover { background: #475569; }
      button.primary { background: #0284c7; }
      button.primary:hover { background: #0369a1; }
      button.danger { background: #991b1b; }
      button.danger:hover { background: #7f1d1d; }
      .create-form { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 24px; }
      .form-row { display: grid; grid-template-columns: 2fr 3fr 1fr 1fr auto; gap: 10px; align-items: center; }
      input, select { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 0.875rem; }
      input:focus, select:focus { outline: none; border-color: var(--primary); }
      .live-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #4ade80; }
      .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
